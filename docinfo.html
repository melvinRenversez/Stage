<style>
  /* --- 0. VARIABLES DU THÈME ET DE MISE EN PAGE --- */
  :root {
    --nav-width: 20; /* Largeur initiale du sommaire à gauche en % */

    --bg-body: #121417;
    --bg-surface: #161b22;
    --bg-elevated: #21262d;
    --bg-footer: #0d1117;
    --border-default: #30363d;

    --text-primary: #e1e4e8;
    --text-secondary: #c9d1d9;
    --text-muted: #8b949e;
    --text-code: #e6edf3;

    --accent-primary: #58a6ff;
    --accent-inline-code: #ff7b72;
  }

  /* --- 1. COULEURS DU THÈME SOMBRE --- */
  body {
    background-color: var(--bg-body) !important;
    color: var(--text-primary) !important;
  }

  /* Titres */
  h1, h2, h3, h4, h5, h6, #toctitle, .sidebarblock > .content > .title {
    color: var(--accent-primary) !important;
  }
  #header h1 {
    border-bottom-color: var(--border-default) !important;
  }
  #header .details {
    color: var(--text-muted) !important;
    border-bottom-color: var(--border-default) !important;
  }

  /* --- 2. SOMMAIRE À GAUCHE (:toc: left) & REDIMENSIONNEMENT --- */
  #toc.toc2 {
    background-color: var(--bg-surface) !important;
    border-right: 1px solid var(--border-default) !important;
    width: calc(var(--nav-width) * 1%) !important;
    min-width: calc(var(--nav-width) * 1%) !important;
    max-width: calc(var(--nav-width) * 1%) !important;
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    height: 100vh !important;
    overflow-y: auto !important;
    z-index: 900;
  }

  /* Décalage synchronisé du corps de la page à droite du sommaire */
  body.toc2 {
    padding-left: calc(var(--nav-width) * 1%) !important;
    padding-right: 0 !important;
  }

  /* Le contenu principal occupe 95% de l'espace restant à droite de la nav */
  body.toc2 #header,
  body.toc2 #content,
  body.toc2 #footer {
    width: 95% !important;
    max-width: 95% !important;
    margin-left: auto !important;
    margin-right: auto !important;
  }

  /* Poignée invisible sur toute la hauteur de la bordure droite du sommaire */
  #toc-resizer {
    position: fixed;
    top: 0;
    left: calc(var(--nav-width) * 1% - 5px);
    width: 10px;
    height: 100vh;
    cursor: col-resize !important;
    z-index: 9999;
    background-color: transparent;
  }

  /* Trait bleu net affiché au survol ou pendant le glissement */
  #toc-resizer::after {
    content: "";
    position: absolute;
    top: 0;
    left: 4px;
    width: 2px;
    height: 100%;
    background-color: transparent;
    transition: background-color 0.15s ease;
  }

  #toc-resizer:hover::after,
  #toc-resizer.resizing::after {
    background-color: var(--accent-primary);
  }

  /* Liens du sommaire */
  #toc a, #top-toc a {
    color: var(--text-secondary) !important;
    text-decoration: none !important;
  }
  #toc a:hover, #top-toc a:hover {
    color: var(--accent-primary) !important;
    text-decoration: none !important;
  }

  /* --- 3. LIENS, CODE ET ÉLÉMENTS DE CONTENU --- */
  a, a:hover, a:focus, a:active,
  h1 a, h2 a, h3 a, h4 a, h5 a, h6 a {
    color: var(--accent-primary) !important;
    text-decoration: none !important;
    border-bottom: none !important;
  }

  /* Code en ligne */
  :not(pre) > code {
    background-color: var(--bg-elevated) !important;
    color: var(--accent-inline-code) !important;
    border: 1px solid var(--border-default) !important;
  }

  /* Blocs de code et terminaux */
  .listingblock pre, .literalblock pre {
    background-color: var(--bg-surface) !important;
    color: var(--text-code) !important;
    border: 1px solid var(--border-default) !important;
  }
  .listingblock > .title, .literalblock > .title, .imageblock > .title, .tableblock > .title {
    color: var(--text-muted) !important;
  }

  /* Tableaux et mise en page comparative (Avant / Après) */
  table.tableblock {
    width: 100% !important;
    table-layout: fixed !important;
    margin: 1.5em auto !important;
    background-color: var(--bg-surface) !important;
    border-color: var(--border-default) !important;
    color: var(--text-primary) !important;
  }
  table.tableblock thead th {
    background-color: var(--bg-elevated) !important;
    color: var(--accent-primary) !important;
    border-color: var(--border-default) !important;
    text-align: center !important;
  }
  table.tableblock td.tableblock {
    background-color: var(--bg-surface) !important;
    border-color: var(--border-default) !important;
    color: var(--text-primary) !important;
    vertical-align: top !important;
    padding: 0.8em !important;
  }
  table.tableblock td.tableblock .listingblock pre {
    overflow-x: auto !important;
    max-width: 100% !important;
    margin: 0 !important;
  }

  /* Encadrés (NOTE, TIP, IMPORTANT, WARNING) */
  .admonitionblock > table {
    background-color: var(--bg-surface) !important;
    border: 1px solid var(--border-default) !important;
  }
  .admonitionblock td.content {
    color: var(--text-secondary) !important;
    border-left-color: var(--border-default) !important;
  }

  /* Pied de page */
  #footer {
    background-color: var(--bg-footer) !important;
    color: var(--text-muted) !important;
  }

  /* Supprime la bordure uniquement sur les blocs ayant le rôle [.sans-bordure] */
.listingblock.border-less pre,
.literalblock.border-less pre {
  border: none !important;
  box-shadow: none !important;
}


  /* Adaptation mobile / petits écrans */
  @media screen and (max-width: 768px) {
    #toc.toc2 {
      position: static !important;
      width: 100% !important;
      min-width: 100% !important;
      max-width: 100% !important;
      height: auto !important;
    }
    body.toc2 {
      padding-left: 0 !important;
    }
    #toc-resizer {
      display: none;
    }
  }

  /* --- 4. COLORATION SYNTAXIQUE HLJS (DARK MODE) --- */
  .hljs {
    display: block;
    overflow-x: auto;
    background: var(--bg-surface) !important;
    color: #abb2bf !important;
  }
  .hljs-comment, .hljs-quote { color: #7f848e !important; font-style: italic; }
  .hljs-keyword, .hljs-selector-tag, .hljs-subst { color: #c678dd !important; font-weight: bold; }
  .hljs-string, .hljs-doctag, .hljs-regexp { color: #98c379 !important; }
  .hljs-number, .hljs-literal, .hljs-symbol, .hljs-bullet { color: #d19a66 !important; }
  .hljs-variable, .hljs-template-variable, .hljs-attr, .hljs-attribute { color: #e06c75 !important; }
  .hljs-title, .hljs-section, .hljs-name, .hljs-selector-id, .hljs-selector-class { color: #61afef !important; font-weight: bold; }
  .hljs-type, .hljs-built_in, .hljs-builtin-name, .hljs-params { color: #e5c07b !important; }
  .hljs-meta, .hljs-meta-keyword { color: #56b6c2 !important; }
  .hljs-addition { color: #98c379 !important; background-color: rgba(46, 160, 67, 0.15) !important; }
  .hljs-deletion { color: #e06c75 !important; background-color: rgba(248, 81, 73, 0.15) !important; }
  .hljs-emphasis { font-style: italic; }
  .hljs-strong { font-weight: bold; }

  @media screen and (max-width: 768px) {
  /* Transforme la structure du tableau en blocs empilés */
  table.tableblock,
  table.tableblock thead,
  table.tableblock tbody,
  table.tableblock tr,
  table.tableblock th,
  table.tableblock td {
    display: block !important;
    width: 100% !important;
    box-sizing: border-box !important;
  }

  /* Masque l'en-tête horizontal original (Avant | Après) */
  table.tableblock thead {
    display: none !important;
  }

  /* Espace et bordure entre les blocs empilés */
  table.tableblock td.tableblock {
    border-bottom: 1px solid var(--border-default) !important;
    padding: 0.6em !important;
  }

  /* Ajoute un bandeau titre "Avant" au-dessus du premier bloc */
  table.tableblock tr td.tableblock:first-child::before {
    content: "Avant";
    display: block;
    font-weight: bold;
    color: var(--accent-primary);
    background-color: var(--bg-elevated);
    padding: 0.4em 0.6em;
    margin-bottom: 0.6em;
    border-radius: 4px;
    text-align: center;
  }

  /* Ajoute un bandeau titre "Après" au-dessus du second bloc */
  table.tableblock tr td.tableblock:nth-child(2)::before {
    content: "Après";
    display: block;
    font-weight: bold;
    color: var(--accent-primary);
    background-color: var(--bg-elevated);
    padding: 0.4em 0.6em;
    margin-bottom: 0.6em;
    border-radius: 4px;
    text-align: center;
  }
}


  /* --- BADGES DE STATUT DANS LES LOGS --- */
  .badge-healthy {
    color: #3fb950 !important;
    background-color: rgba(46, 160, 67, 0.2) !important;
    border: 1px solid rgba(63, 185, 80, 0.4);
    border-radius: 4px;
    padding: 1px 6px;
    font-weight: bold;
  }

  .badge-error {
    color: #ff7b72 !important;
    background-color: rgba(248, 81, 73, 0.2) !important;
    border: 1px solid rgba(255, 123, 114, 0.4);
    border-radius: 4px;
    padding: 1px 6px;
    font-weight: bold;
  }


  .listingblock .content {
    position: relative;
  }

  .copy-code-btn {
    position: absolute;
    bottom: 8px;
    right: 8px;
    padding: 4px 10px;
    font-size: 12px;
    font-family: sans-serif;
    color: #f8f9fa;
    background-color: rgba(45, 55, 72, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 4px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.2s ease, background-color 0.2s ease;
    z-index: 10;
  }

  .listingblock .content:hover .copy-code-btn {
    opacity: 1;
  }

  .copy-code-btn:hover {
    background-color: #2b6cb0;
  }

  .copy-code-btn.copied {
    background-color: #2f855a;
    border-color: #48bb78;
    opacity: 1;
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const sideToc = document.getElementById("toc");
    const content = document.getElementById("content");

    // 1. Duplication du sommaire en haut du contenu principal
    if (sideToc && content) {
      const topToc = sideToc.cloneNode(true);
      topToc.id = "top-toc";
      topToc.className = "toc";
      topToc.style.marginBottom = "2em";
      topToc.style.padding = "1.2em";
      topToc.style.border = "1px solid var(--border-default)";
      topToc.style.borderRadius = "6px";
      topToc.style.backgroundColor = "var(--bg-surface)";

      content.insertBefore(topToc, content.firstChild);
    }

    // 2. Redimensionnement interactif du sommaire à gauche
    if (sideToc) {
      const savedWidth = localStorage.getItem("adoc-nav-width");
      if (savedWidth) {
        document.documentElement.style.setProperty("--nav-width", savedWidth);
      }

      const resizer = document.createElement("div");
      resizer.id = "toc-resizer";
      resizer.title = "Cliquer et glisser pour redimensionner le sommaire";
      document.body.appendChild(resizer);

      let isResizing = false;

      resizer.addEventListener("mousedown", function (e) {
        isResizing = true;
        resizer.classList.add("resizing");
        document.body.style.cursor = "col-resize";
        document.body.style.userSelect = "none";
        e.preventDefault();
      });

      document.addEventListener("mousemove", function (e) {
        if (!isResizing) return;

        // Calcul direct depuis le bord gauche de l'écran (clientX)
        let newWidthPercent = (e.clientX / window.innerWidth) * 100;
        newWidthPercent = Math.max(10, Math.min(50, newWidthPercent));

        document.documentElement.style.setProperty("--nav-width", newWidthPercent.toFixed(2));
      });

      document.addEventListener("mouseup", function () {
        if (!isResizing) return;
        isResizing = false;
        resizer.classList.remove("resizing");
        document.body.style.cursor = "";
        document.body.style.userSelect = "";

        const currentWidth = getComputedStyle(document.documentElement).getPropertyValue("--nav-width").trim();
        localStorage.setItem("adoc-nav-width", currentWidth);
      });
    }

    // 3. Ajout du bouton Copier sur chaque bloc de code
    document.querySelectorAll(".listingblock .content").forEach(function (block) {
      const codeEl = block.querySelector("pre code") || block.querySelector("pre");
      if (!codeEl) return;

      const btn = document.createElement("button");
      btn.className = "copy-code-btn";
      btn.type = "button";
      btn.textContent = "Copier";

      btn.addEventListener("click", function () {
        navigator.clipboard.writeText(codeEl.innerText).then(function () {
          btn.textContent = "Copié !";
          btn.classList.add("copied");
          setTimeout(function () {
            btn.textContent = "Copier";
            btn.classList.remove("copied");
          }, 2000);
        });
      });

      block.appendChild(btn);
    });
  });
</script>
